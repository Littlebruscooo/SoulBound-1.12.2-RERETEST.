buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://minecraftforge.net" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = "1.0.0"
group = "com.soulbound.deltarune"
archivesBaseName = "soulbound-1.12.2"
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = "stable_39"
}
