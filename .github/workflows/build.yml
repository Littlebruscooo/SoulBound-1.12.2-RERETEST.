name: Build Soulbound 1.12.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Original Assets
        run: |
          mkdir -p src/main/resources/assets
          unzip -o turnbattle-2.1.1.jar "assets/turnbattle/*" -d src/main/resources/

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Run build
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: soulbound-1.12.2-full
          path: build/libs/*.jar
